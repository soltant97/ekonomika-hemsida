<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekonomikas kontor – konceptprototyp</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css?v=1795790079">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<div id="view" aria-hidden="true"></div><div id="labels" aria-hidden="true"></div><div id="loading">Kontoret öppnar…</div>

<div class="hud card" id="intro">
  <img src="logo-color.png" alt="Ekonomika">
  <h1>Välkommen in på kontoret</h1>
  <p>Klicka på en medarbetare för att se steg för steg hur vi arbetar med bokföring, rapporter, skatter, bokslut och lön.</p>
</div>


<div class="hud" id="dock">
  <nav class="card" id="roster" aria-label="Medarbetare"></nav>
  <div class="card" id="ctrl">
    <button type="button" class="flow" id="flowbtn" aria-pressed="true"><i></i><span>Visa flöden</span></button>
    <button type="button" id="rl" aria-label="Vrid åt vänster">⟲</button><button type="button" id="rr" aria-label="Vrid åt höger">⟳</button><button type="button" id="zin" aria-label="Zooma in">+</button>
    <button type="button" id="zout" aria-label="Zooma ut">−</button>
  </div>
</div>
<div id="hint">Dra för att vrida runt kontoret. Högerklicka och dra för att flytta, scrolla för att zooma.</div>

<aside class="card" id="panel" aria-label="Medarbetare" aria-hidden="true">
  <div class="p-top"><div class="av" id="pav"><span></span></div><div><h2 id="pname"></h2><p id="pdept"></p></div><button type="button" class="p-x" id="pclose" aria-label="Tillbaka till hela kontoret">✕</button></div>
  <div class="p-body" id="pbody"></div>
  <div class="p-act"><button type="button" class="btn" id="pmore">Läs mer</button><button type="button" class="btn pri" id="pchat">Chatta</button></div>
  <div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="sugg" id="sugg"></div>
    <p class="proto">Prototyp. Svaren är förskrivna exempel.</p>
    <form class="cform" id="cform"><input id="cin" placeholder="Skriv en fråga…" autocomplete="off" aria-label="Din fråga"><button type="submit">Skicka</button></form>
  </div>
</aside>

<script type="module" src="main.js?v=1795790079"></script>
</body>
</html>
